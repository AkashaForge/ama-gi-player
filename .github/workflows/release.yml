name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег для релиза (например, v1.0.9)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka ordered-set zstandard
          Write-Host "== Проверка пакетов ==" -ForegroundColor Cyan
          python -c "import nuitka; print('nuitka OK')"
          python -c "import PyQt6.QtCore; print('QtCore OK')"
          python -c "import PyQt6.QtWidgets; print('QtWidgets OK')"
          python -c "import PyQt6.QtMultimedia; print('QtMultimedia OK')"
          python -c "import PyQt6.QtMultimediaWidgets; print('QtMultimediaWidgets OK')"
          python -c "import PyQt6.QtWebEngineWidgets; print('QtWebEngineWidgets OK')"
          python -c "import libtorrent; print('libtorrent OK')"
          python -c "import aiohttp; print('aiohttp OK')"
          python -c "import nodriver; print('nodriver OK')"
          python -c "import psutil; print('psutil OK')"
          python -c "import qasync; print('qasync OK')"
          python -c "import websockets; print('websockets OK')"

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Resolved: $TAG (version=${TAG#v})"

      - name: Clean build dirs
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force build, dist -ErrorAction SilentlyContinue
          Remove-Item -Force *.spec, nuitka-crash-report.xml -ErrorAction SilentlyContinue

      - name: Build with Nuitka (onefile)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $nuitkaArgs = @(
            "--onefile"
            "--enable-plugin=pyqt6"
            "--include-module=PyQt6.QtWebEngineCore"
            "--include-module=PyQt6.QtWebEngineWidgets"
            "--include-package=libtorrent"
            "--include-package-data=libtorrent"
            "--include-data-dir=data=data"
            "--include-data-file=ui/styles.qss=ui/styles.qss"
            "--windows-console-mode=disable"
            "--output-dir=dist"
            "--output-filename=ama-gi-player.exe"
            "--assume-yes-for-downloads"
            "--company-name=AkashaForge"
            "--product-name=Amagi-Player"
            "main.py"
          )

          Write-Host "== Запуск Nuitka ==" -ForegroundColor Cyan
          Write-Host "python -m nuitka $($nuitkaArgs -join ' ')"

          & python -m nuitka $nuitkaArgs
          if ($LASTEXITCODE -ne 0) {
            Write-Host "[ERROR] Nuitka вернул код $LASTEXITCODE" -ForegroundColor Red
            exit 1
          }

      - name: Verify build output
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "dist\ama-gi-player.exe"
          if (-not (Test-Path $exe)) {
            Write-Host "[ERROR] $exe не создан" -ForegroundColor Red
            if (Test-Path "dist") {
              Get-ChildItem -Recurse "dist" | Select-Object FullName, Length | Out-Host
            }
            exit 1
          }
          $sizeMB = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "[OK] exe: $sizeMB MB" -ForegroundColor Green

      - name: Prepare package contents
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.version.outputs.version }}"
          $pkgDir = "dist\amagi-player-v$version"

          New-Item -ItemType Directory -Force $pkgDir | Out-Null
          Copy-Item "dist\ama-gi-player.exe" "$pkgDir\ama-gi-player.exe"

          $binDir = "$pkgDir\bin"
          New-Item -ItemType Directory -Force $binDir | Out-Null

          $binReadmeLines = @(
            "Сюда кладите внешние утилиты:",
            "  - aria2c.exe",
            "  - Jackett (папка целиком)",
            "  - Prowlarr (папка целиком)",
            "  - ffmpeg.exe",
            "",
            "Приложение ищет их по пути:",
            "  <папка_с_ama-gi-player.exe>\bin\"
          )
          Set-Content -Path "$binDir\README.txt" -Value $binReadmeLines -Encoding UTF8

          if (Test-Path ".env.example") {
            Copy-Item ".env.example" "$pkgDir\.env.example"
            Write-Host "[OK] .env.example скопирован" -ForegroundColor Green
          } else {
            $envLines = @(
              "# Amagi-Player — локальный конфиг.",
              "# Скопируйте этот файл в .env (рядом с ama-gi-player.exe) и заполните.",
              "",
              "# API-ключ Кинопоиска (если используется)",
              "KP_API_KEY=",
              "",
              "# Секрет aria2 (если используется)",
              "ARIA2_SECRET="
            )
            Set-Content -Path "$pkgDir\.env.example" -Value $envLines -Encoding UTF8
            Write-Host "[OK] .env.example сгенерирован" -ForegroundColor Green
          }

          if (Test-Path "INSTALL.md") {
            Copy-Item "INSTALL.md" "$pkgDir\README.txt"
          } elseif (Test-Path "README.md") {
            Copy-Item "README.md" "$pkgDir\README.txt"
          }

          Write-Host "[OK] Дистрибутив готов: $pkgDir" -ForegroundColor Green
          Get-ChildItem -Recurse $pkgDir | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Package ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.version.outputs.version }}"
          $zip = "dist\amagi-player-v$version-windows.zip"
          Compress-Archive -Path "dist\amagi-player-v$version\*" -DestinationPath $zip -Force
          if (-not (Test-Path $zip)) {
            Write-Host "[ERROR] ZIP не создан" -ForegroundColor Red
            exit 1
          }
          $sizeMB = [math]::Round((Get-Item $zip).Length / 1MB, 1)
          Write-Host "[OK] $zip ($sizeMB MB)" -ForegroundColor Green

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            dist/*.zip
            dist/ama-gi-player.exe
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Amagi-Player ${{ steps.version.outputs.tag }}"
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/ama-gi-player.exe
          draft: false
          prerelease: false
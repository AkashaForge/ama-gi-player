name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g., v2.2.5)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Build standalone and release
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka ordered-set zstandard

          Write-Host "== Verify imports ==" -ForegroundColor Cyan
          python -c "import PyQt6.QtWidgets; print('PyQt6 widgets OK')"
          python -c "import PyQt6.QtMultimedia; print('PyQt6 multimedia OK')"
          python -c "import PyQt6.QtWebEngineWidgets; print('WebEngine OK')"
          python -c "import libtorrent; print('libtorrent OK')"
          python -c "import aiohttp; print('aiohttp OK')"
          python -c "import defusedxml; print('defusedxml OK')"
          python -c "from defusedxml.ElementTree import fromstring; print('defusedxml.ElementTree OK')"
          python -c "import curl_cffi.requests; print('curl_cffi OK')"
          python -c "import cloudscraper; print('cloudscraper OK')"
          python -c "import qasync, psutil, websockets, nodriver; print('rest OK')"

      - name: Determine defusedxml path
        id: defusedxml_path
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $defused_path = (& python -c "import defusedxml, os; print(os.path.dirname(defusedxml.__file__))").Trim()
          Write-Host "defusedxml path: $defused_path"
          "path=$defused_path" >> $env:GITHUB_OUTPUT

      - name: Sanity-check whitelist_seed.db
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path "data\whitelist_seed.db")) {
            Write-Host "[ERROR] data\whitelist_seed.db missing" -ForegroundColor Red
            exit 1
          }
          $count = (& python -c "import sqlite3,sys; print(sqlite3.connect(sys.argv[1]).execute('SELECT COUNT(*) FROM movie_whitelist').fetchone()[0])" "data/whitelist_seed.db").Trim()
          $withIa = (& python -c "import sqlite3,sys; print(sqlite3.connect(sys.argv[1]).execute('SELECT COUNT(*) FROM movie_whitelist WHERE length(archive_identifier) > 0').fetchone()[0])" "data/whitelist_seed.db").Trim()
          Write-Host "whitelist_seed.db: $count films, $withIa with archive_identifier" -ForegroundColor Cyan
          if ([int]$count -eq 0) {
            Write-Host "[ERROR] whitelist_seed.db empty" -ForegroundColor Red
            exit 1
          }

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ("${{ github.event.inputs.tag }}" -ne "") {
            $tag = "${{ github.event.inputs.tag }}"
          } else {
            $tag = "$env:GITHUB_REF_NAME"
          }
          $version = $tag -replace '^v', ''
          $cleanVersion = $version -replace '[-+].*$', ''
          $parts = @($cleanVersion.Split('.'))
          while ($parts.Count -lt 4) { $parts += "0" }
          $version4 = ($parts | Select-Object -First 4) -join '.'
          "tag=$tag"           >> $env:GITHUB_OUTPUT
          "version=$version"   >> $env:GITHUB_OUTPUT
          "version4=$version4" >> $env:GITHUB_OUTPUT
          Write-Host "Tag=$tag Version=$version Version4=$version4"

      - name: Build with Nuitka (standalone)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $v4 = "${{ steps.version.outputs.version4 }}"
          $defused_path = "${{ steps.defusedxml_path.outputs.path }}"
          $site_packages = Split-Path $defused_path -Parent

          $nuitkaArgs = @(
            "--standalone"
            "--enable-plugin=pyqt6"

            # --- PyQt6 core ---
            "--include-package=PyQt6"
            "--include-qt-plugins=multimedia"
            "--include-module=PyQt6.QtWebEngineCore"
            "--include-module=PyQt6.QtWebEngineWidgets"

            # --- defusedxml (force include + plugin directory for dynamic import) ---
            "--include-package=defusedxml"
            "--include-package-data=defusedxml"
            "--follow-import-to=defusedxml"
            "--include-module=defusedxml"
            "--include-module=defusedxml.common"
            "--include-module=defusedxml.ElementTree"
            "--include-module=defusedxml.cElementTree"
            "--include-module=defusedxml.expatbuilder"
            "--include-module=defusedxml.expatreader"
            "--include-module=defusedxml.minidom"
            "--include-module=defusedxml.pulldom"
            "--include-module=defusedxml.sax"
            "--include-module=defusedxml.xmlrpc"
            "--include-plugin-directory=$defused_path"

            # --- curl_cffi (C-extension + wrapper) ---
            "--include-package=curl_cffi"
            "--include-package-data=curl_cffi"
            "--include-module=curl_cffi.requests"
            "--include-module=curl_cffi._wrapper"

            # --- cloudscraper ---
            "--include-package=cloudscraper"
            "--include-package-data=cloudscraper"
            "--follow-import-to=cloudscraper"

            # --- existing packages ---
            "--include-package=libtorrent"
            "--include-package=aiohttp"
            "--include-package=websockets"
            "--include-package=qasync"
            "--include-package=psutil"
            "--include-package=nodriver"

            # --- data ---
            "--include-data-dir=data=data"
            "--include-data-dir=ui=ui"

            # --- exe metadata ---
            "--windows-console-mode=force"
            "--output-dir=dist"
            "--output-filename=amagi-player.exe"
            "--assume-yes-for-downloads"
            "--company-name=AkashaForge"
            "--product-name=Amagi-Player"
            "--file-version=$v4"
            "--product-version=$v4"
            "--file-description=Amagi-Player"
            "--report=dist/nuitka-report.xml"
            "main.py"
          )

          Write-Host ""
          Write-Host "python -m nuitka $($nuitkaArgs -join ' ')" -ForegroundColor Gray
          Write-Host ""
          python -m nuitka @nuitkaArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify build (files + critical modules)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $d = "dist\main.dist"
          if (-not (Test-Path $d)) { Write-Host "[ERROR] dist/main.dist missing" -ForegroundColor Red; exit 1 }

          $exe = "$d\amagi-player.exe"
          if (-not (Test-Path $exe)) { Write-Host "[ERROR] exe not built" -ForegroundColor Red; exit 1 }
          $mb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          $distMB = [math]::Round((Get-ChildItem $d -Recurse | Measure-Object -Property Length -Sum).Sum / 1MB, 1)
          Write-Host "[OK] exe: $mb MB | main.dist: $distMB MB" -ForegroundColor Green

          # data/ui files
          if (-not (Test-Path "$d\data\whitelist_seed.db")) { Write-Host "[ERROR] whitelist_seed.db missing in dist" -ForegroundColor Red; exit 1 }
          if (-not (Test-Path "$d\ui\styles.qss"))          { Write-Host "[ERROR] ui/styles.qss missing in dist" -ForegroundColor Red; exit 1 }
          Write-Host "[OK] data + ui present" -ForegroundColor Green

          # defusedxml: проверяем, что пакет реально попал в .dist
          $defusedDir = Get-ChildItem $d -Recurse -Directory -Filter "defusedxml" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $defusedDir) { Write-Host "[ERROR] defusedxml directory missing in dist" -ForegroundColor Red; exit 1 }
          $defusedPy = Get-ChildItem $defusedDir.FullName -Filter "*.py" -ErrorAction SilentlyContinue
          if ($defusedPy.Count -eq 0) { Write-Host "[ERROR] defusedxml has no .py files in dist" -ForegroundColor Red; exit 1 }
          Write-Host "[OK] defusedxml present in dist ($($defusedPy.Count) .py files)" -ForegroundColor Green

          # Qt multimedia plugin
          $mmFiles = Get-ChildItem $d -Recurse -Filter "*mediaplugin.dll" -ErrorAction SilentlyContinue
          if ($mmFiles.Count -eq 0) {
            Write-Host "[ERROR] No multimedia plugin DLL in dist" -ForegroundColor Red
            exit 1
          }
          Write-Host "[OK] multimedia plugins: $($mmFiles.Count)" -ForegroundColor Green

          # ffmpeg backend
          $ffmpegDlls = Get-ChildItem $d -Recurse -Filter "avcodec-*.dll" -ErrorAction SilentlyContinue
          if ($ffmpegDlls.Count -eq 0) {
            Write-Host "[ERROR] No avcodec-*.dll in dist" -ForegroundColor Red
            exit 1
          }
          Write-Host "[OK] ffmpeg backend: $($ffmpegDlls.Count) dll" -ForegroundColor Green

          # C-extensions presence
          $lt = Get-ChildItem $d -Recurse -Filter "libtorrent*.pyd" -ErrorAction SilentlyContinue
          if ($lt.Count -eq 0) { Write-Host "[ERROR] libtorrent.pyd missing" -ForegroundColor Red; exit 1 }
          $cc = Get-ChildItem $d -Recurse -Filter "curl_cffi*" -ErrorAction SilentlyContinue
          if ($cc.Count -eq 0) { Write-Host "[ERROR] curl_cffi missing in dist" -ForegroundColor Red; exit 1 }
          Write-Host "[OK] C-extensions (libtorrent, curl_cffi) present" -ForegroundColor Green

      - name: Prepare distribution
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dist = "dist\main.dist"
          $data = Join-Path $dist "data"
          $bin  = Join-Path $dist "bin"

          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          @(
            "Amagi-Player - external utilities folder",
            "=========================================",
            "",
            "Optional: place here",
            "  Aria2\aria2c.exe",
            "  Jackett\  (whole folder)",
            "  Prowlarr\ (whole folder)",
            "",
            "Not used in PUBLIC mode."
          ) | Set-Content -Path (Join-Path $bin "README.txt") -Encoding UTF8

          $personal = @(
            "sources.txt","sources.txt.bak",
            "direct_sources.txt","direct_sources.txt.bak",
            "indexers.txt","mode.txt",
            "app_data.db","app_data.db-wal","app_data.db-shm",
            "yts_api_base.txt","yts_api_base.txt.private.bak"
          )
          foreach ($f in $personal) {
            $p = Join-Path $data $f
            if (Test-Path $p) { Remove-Item $p -Force }
          }

          $seedDb = Join-Path $data "whitelist_seed.db"
          $workDb = Join-Path $data "whitelist.db"
          if (-not (Test-Path $seedDb)) { Write-Host "[ERROR] seed missing" -ForegroundColor Red; exit 1 }
          foreach ($sfx in @("", "-wal", "-shm")) {
            $p = "$workDb$sfx"
            if (Test-Path $p) { Remove-Item $p -Force }
          }
          Copy-Item $seedDb $workDb
          $seedCount = (& python -c "import sqlite3,sys; print(sqlite3.connect(sys.argv[1]).execute('SELECT COUNT(*) FROM movie_whitelist').fetchone()[0])" $workDb).Trim()
          Write-Host "[OK] whitelist.db <- whitelist_seed.db ($seedCount films)" -ForegroundColor Green
          & python -c "import sqlite3,sys; c=sqlite3.connect(sys.argv[1]); c.execute('UPDATE movie_whitelist SET available=1 WHERE available IS NULL'); c.commit(); c.close()" $workDb

          @(
            "# Amagi-Player - local config",
            "# Copy to .env next to exe",
            "KP_API_KEY=",
            "ARIA2_SECRET="
          ) | Set-Content -Path (Join-Path $dist "config.example.txt") -Encoding UTF8

          @(
            "Amagi-Player - how to run",
            "==========================",
            "",
            "1. Run amagi-player.exe",
            "2. Accept the terms on first launch",
            "3. data\ and bin\ are used as-is from this ZIP",
            "4. Sources: data\sources.txt (template: data\sources.example.txt)",
            "5. API keys: .env next to exe (template: config.example.txt)",
            "",
            "Mode: data\mode.txt -> public | private (default: public)"
          ) | Set-Content -Path (Join-Path $dist "README.txt") -Encoding UTF8

          if (Test-Path "README.md") { Copy-Item "README.md" (Join-Path $dist "README.md") }
          if (Test-Path "LICENSE")   { Copy-Item "LICENSE"   (Join-Path $dist "LICENSE") }
          if (Test-Path "NOTICE")    { Copy-Item "NOTICE"    (Join-Path $dist "NOTICE") }

      - name: Create ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.version.outputs.version }}"
          $zip = "dist/amagi-player-v$version-windows.zip"
          Compress-Archive -Path "dist/main.dist/*" -DestinationPath $zip -Force
          $mb = [math]::Round((Get-Item $zip).Length / 1MB, 1)
          Write-Host "[OK] $zip ($mb MB)" -ForegroundColor Green

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            dist/*.zip
            dist/nuitka-report.xml
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Amagi-Player ${{ steps.version.outputs.tag }}"
          generate_release_notes: true
          files: dist/amagi-player-v${{ steps.version.outputs.version }}-windows.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') }}
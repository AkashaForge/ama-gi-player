name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег для релиза (например, v1.0.11)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Build and release
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka ordered-set zstandard

          Write-Host "== Проверка пакетов ==" -ForegroundColor Cyan
          python -c "import PyQt6.QtWebEngineWidgets; print('WebEngine OK')"
          python -c "import libtorrent; print('libtorrent OK')"
          python -c "import aiohttp; print('aiohttp', aiohttp.__version__)"
          python -c "import aiohttp.resolver; print('aiohttp.resolver OK')"
          python -c "import certifi, os; print('certifi:', os.path.dirname(certifi.__file__))"
          python -c "import ssl; print('ssl OK')"
          python -c "import nodriver; print('nodriver OK')"
          python -c "import psutil; print('psutil OK')"
          python -c "import qasync; print('qasync OK')"
          python -c "import websockets; print('websockets OK')"

          # Явно проверить, что cacert.pem существует
          $certifiDir = (& python -c "import certifi, os; print(os.path.dirname(certifi.__file__))").Trim()
          $cacert = Join-Path $certifiDir "cacert.pem"
          Write-Host "cacert.pem: $cacert"
          if (-not (Test-Path $cacert)) {
            Write-Host "[ERROR] cacert.pem не найден" -ForegroundColor Red
            exit 1
          }
          Write-Host "[OK] cacert.pem найден ($((Get-Item $cacert).Length) bytes)" -ForegroundColor Green

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if ("${{ github.event.inputs.tag }}" -ne "") {
            $tag = "${{ github.event.inputs.tag }}"
          } else {
            $tag = "$env:GITHUB_REF_NAME"
          }

          if ([string]::IsNullOrWhiteSpace($tag)) {
            Write-Host "[ERROR] Не удалось определить тег" -ForegroundColor Red
            exit 1
          }

          $version = $tag -replace '^v', ''
          $parts = @($version.Split('.'))
          while ($parts.Count -lt 4) { $parts += "0" }
          $version4 = ($parts | Select-Object -First 4) -join '.'

          Write-Host "Tag:      $tag"
          Write-Host "Version:  $version"
          Write-Host "Version4: $version4"

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "version4=$version4" >> $env:GITHUB_OUTPUT

      - name: Build with Nuitka (console for diagnostics)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $v4 = "${{ steps.version.outputs.version4 }}"

          # Явный путь к cacert.pem для --include-data-files
          $certifiDir = (& python -c "import certifi, os; print(os.path.dirname(certifi.__file__))").Trim()
          $cacertPath = Join-Path $certifiDir "cacert.pem"
          Write-Host "certifi dir: $certifiDir"
          Write-Host "cacert.pem:  $cacertPath"

          if (-not (Test-Path $cacertPath)) {
            Write-Host "[ERROR] cacert.pem не найден" -ForegroundColor Red
            exit 1
          }

          $nuitkaArgs = @(
            "--onefile"
            "--enable-plugin=pyqt6"
            "--include-package=PyQt6"
            "--include-module=PyQt6.QtWebEngineCore"
            "--include-module=PyQt6.QtWebEngineWidgets"
            "--include-package=libtorrent"
            "--include-package-data=libtorrent"
            "--include-package=aiohttp"
            "--include-package=aiohttp.client"
            "--include-package=aiohttp.web"
            "--include-package=aiohttp.resolver"
            "--include-module=certifi"
            "--include-data-files=$cacertPath=certifi/cacert.pem"
            "--include-package=websockets"
            "--include-package=qasync"
            "--include-package=psutil"
            "--include-package=nodriver"
            "--include-data-dir=data=data"
            "--include-data-file=ui/styles.qss=ui/styles.qss"
            "--windows-console-mode=force"
            "--output-dir=dist"
            "--output-filename=ama-gi-player.exe"
            "--assume-yes-for-downloads"
            "--company-name=AkashaForge"
            "--product-name=Amagi-Player"
            "--file-version=$v4"
            "--product-version=$v4"
            "--file-description=Amagi-Player"
            "--report=dist/nuitka-report.xml"
            "main.py"
          )

          Write-Host ""
          Write-Host "python -m nuitka $($nuitkaArgs -join ' ')" -ForegroundColor Gray
          Write-Host ""

          & python -m nuitka $nuitkaArgs
          if ($LASTEXITCODE -ne 0) {
            Write-Host "[ERROR] Nuitka exit code: $LASTEXITCODE" -ForegroundColor Red
            exit $LASTEXITCODE
          }

      - name: Verify exe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path "dist/ama-gi-player.exe")) {
            Write-Host "[ERROR] exe not created" -ForegroundColor Red
            Get-ChildItem -Recurse dist | Out-Host
            exit 1
          }
          $mb = [math]::Round((Get-Item "dist/ama-gi-player.exe").Length / 1MB, 1)
          Write-Host "[OK] exe: $mb MB" -ForegroundColor Green

      - name: Prepare package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.version.outputs.version }}"
          $pkg = "dist/amagi-player-v$version"

          New-Item -ItemType Directory -Force $pkg | Out-Null
          Copy-Item "dist/ama-gi-player.exe" "$pkg/ama-gi-player.exe"

          New-Item -ItemType Directory -Force "$pkg/bin" | Out-Null
          Set-Content -Path "$pkg/bin/README.txt" -Encoding UTF8 -Value @(
            "Amagi-Player — папка внешних утилит",
            "",
            "Сюда кладите:",
            "  Aria2/aria2c.exe",
            "  Jackett/  (папка целиком)",
            "  Prowlarr/ (папка целиком)"
          )

          Set-Content -Path "$pkg/.env.example" -Encoding UTF8 -Value @(
            "# Amagi-Player — локальный конфиг",
            "KP_API_KEY=",
            "ARIA2_SECRET="
          )

          if (Test-Path "README.md") {
            Copy-Item "README.md" "$pkg/README.txt"
          }

          Copy-Item "dist/ama-gi-player.exe" "dist/amagi-player-v$version.exe"

          Write-Host "Содержимое пакета:" -ForegroundColor Cyan
          Get-ChildItem -Recurse $pkg | Select-Object FullName | Out-Host

      - name: Create ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.version.outputs.version }}"
          $zip = "dist/amagi-player-v$version-windows.zip"

          Compress-Archive -Path "dist/amagi-player-v$version/*" -DestinationPath $zip -Force

          if (-not (Test-Path $zip)) {
            Write-Host "[ERROR] ZIP not created" -ForegroundColor Red
            exit 1
          }

          $mb = [math]::Round((Get-Item $zip).Length / 1MB, 1)
          Write-Host "[OK] $zip ($mb MB)" -ForegroundColor Green

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            dist/*.zip
            dist/amagi-player-v*.exe
            dist/nuitka-report.xml
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Amagi-Player ${{ steps.version.outputs.tag }}"
          generate_release_notes: true
          files: |
            dist/amagi-player-v${{ steps.version.outputs.version }}-windows.zip
            dist/amagi-player-v${{ steps.version.outputs.version }}.exe
          draft: false
          prerelease: false
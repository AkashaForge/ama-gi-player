name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег для релиза (например, v1.0.8)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows build (Nuitka onefile)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka ordered-set zstandard

          Write-Host "== Версии пакетов ==" -ForegroundColor Cyan
          pip list | Select-String -Pattern "PyQt6|nuitka|libtorrent|aiohttp|nodriver|psutil|qasync|websockets"

          Write-Host ""
          Write-Host "== Проверка импортов ==" -ForegroundColor Cyan
          python -c "import PyQt6.QtCore; from PyQt6.QtCore import QT_VERSION_STR; print('QtCore OK, Qt', QT_VERSION_STR)"
          python -c "import PyQt6.QtWidgets; print('QtWidgets OK')"
          python -c "import PyQt6.QtMultimedia; print('QtMultimedia OK')"
          python -c "import PyQt6.QtMultimediaWidgets; print('QtMultimediaWidgets OK')"
          python -c "import PyQt6.QtWebEngineWidgets; print('QtWebEngineWidgets OK')"
          python -c "import PyQt6.QtWebEngineCore; print('QtWebEngineCore OK')"
          python -c "import libtorrent; print('libtorrent OK')"
          python -c "import aiohttp; print('aiohttp', aiohttp.__version__)"
          python -c "import nodriver; print('nodriver OK')"
          python -c "import psutil; print('psutil', psutil.__version__)"
          python -c "import qasync; print('qasync OK')"
          python -c "import websockets; print('websockets', websockets.__version__)"

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if ("${{ github.event.inputs.tag }}" -ne "") {
            $tag = "${{ github.event.inputs.tag }}"
          } else {
            $tag = "$env:GITHUB_REF_NAME"
          }

          if ([string]::IsNullOrWhiteSpace($tag)) {
            Write-Host "[ERROR] Не удалось определить тег" -ForegroundColor Red
            exit 1
          }

          # "v1.0.8" → "1.0.8"
          $version = $tag -replace '^v', ''

          # Nuitka требует A.B.C.D — дополняем нулями
          $parts = @($version.Split('.'))
          while ($parts.Count -lt 4) { $parts += "0" }
          $version4 = ($parts | Select-Object -First 4) -join '.'

          # Все части должны быть числами
          foreach ($p in $version4.Split('.')) {
            if ($p -notmatch '^\d+$') {
              Write-Host "[ERROR] Некорректная версия: $version4 (должно быть A.B.C.D)" -ForegroundColor Red
              exit 1
            }
          }

          Write-Host "Tag:       $tag"
          Write-Host "Version:   $version"
          Write-Host "Version4:  $version4"

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "version4=$version4" >> $env:GITHUB_OUTPUT

      - name: Clean build artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          Remove-Item -Recurse -Force build, dist -ErrorAction SilentlyContinue
          Remove-Item -Force *.spec, nuitka-crash-report.xml -ErrorAction SilentlyContinue
          Get-ChildItem -Recurse -Directory -Filter "*.dist" -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force
          Get-ChildItem -Recurse -Directory -Filter "*.build" -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force
          Write-Host "[OK] Очищено"

      - name: Build with Nuitka (onefile)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version4 = "${{ steps.version.outputs.version4 }}"

          Write-Host "== Nuitka: версия $version4 ==" -ForegroundColor Cyan

          $nuitkaArgs = @(
            "--onefile"
            "--enable-plugin=pyqt6"
            "--include-module=PyQt6.QtWebEngineCore"
            "--include-module=PyQt6.QtWebEngineWidgets"
            "--include-package=libtorrent"
            "--include-package-data=libtorrent"
            "--include-data-dir=data=data"
            "--include-data-file=ui/styles.qss=ui/styles.qss"
            "--windows-console-mode=disable"
            "--output-dir=dist"
            "--output-filename=ama-gi-player.exe"
            "--assume-yes-for-downloads"
            "--company-name=AkashaForge"
            "--product-name=Amagi-Player"
            "--file-version=$version4"
            "--product-version=$version4"
            "--file-description=Amagi-Player"
            "--copyright=Copyright (C) 2026 AkashaForge"
            "--report=dist/nuitka-report.xml"
            "main.py"
          )

          Write-Host "Команда:" -ForegroundColor Gray
          Write-Host "python -m nuitka $($nuitkaArgs -join ' ')" -ForegroundColor Gray
          Write-Host ""

          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          & python -m nuitka $nuitkaArgs
          $exitCode = $LASTEXITCODE
          $sw.Stop()

          Write-Host ""
          Write-Host ("=" * 60)
          Write-Host ("Длительность: {0:N1} мин" -f $sw.Elapsed.TotalMinutes)
          Write-Host ("Exit code:    {0}" -f $exitCode)
          Write-Host ("=" * 60)

          if ($exitCode -ne 0) {
            Write-Host "[ERROR] Nuitka упал с кодом $exitCode" -ForegroundColor Red
            if (Test-Path "dist/nuitka-report.xml") {
              Write-Host "Отчёт Nuitka: dist/nuitka-report.xml" -ForegroundColor Yellow
            }
            exit $exitCode
          }

      - name: Verify build output
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "dist/ama-gi-player.exe"

          Write-Host "== Проверка сборки ==" -ForegroundColor Cyan

          if (-not (Test-Path $exe)) {
            Write-Host "[ERROR] $exe не создан" -ForegroundColor Red
            if (Test-Path "dist") {
              Get-ChildItem -Recurse "dist" | Select-Object FullName, Length | Out-Host
            }
            exit 1
          }

          $file = Get-Item $exe
          $sizeMB = [math]::Round($file.Length / 1MB, 1)

          if ($file.Length -lt 20MB) {
            Write-Host "[ERROR] exe слишком маленький ($sizeMB MB) — вероятно, не включены зависимости" -ForegroundColor Red
            exit 1
          }

          if ($file.Length -gt 400MB) {
            Write-Host "[WARN] exe очень большой ($sizeMB MB) — возможно, попал лишний мусор" -ForegroundColor Yellow
          }

          Write-Host "[OK] $($file.Name): $sizeMB MB" -ForegroundColor Green

          $vi = $file.VersionInfo
          Write-Host ""
          Write-Host "== Version metadata ==" -ForegroundColor Cyan
          Write-Host "  CompanyName:      $($vi.CompanyName)"
          Write-Host "  ProductName:      $($vi.ProductName)"
          Write-Host "  FileVersion:      $($vi.FileVersion)"
          Write-Host "  ProductVersion:   $($vi.ProductVersion)"
          Write-Host "  FileDescription:  $($vi.FileDescription)"
          Write-Host "  LegalCopyright:   $($vi.LegalCopyright)"

          if ($vi.CompanyName -ne "AkashaForge") {
            Write-Host "[WARN] CompanyName не совпадает с ожидаемым" -ForegroundColor Yellow
          }

      - name: Prepare package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.version.outputs.version }}"
          $pkgName = "amagi-player-v$version"
          $pkgDir = "dist/$pkgName"

          Write-Host "== Сборка дистрибутива: $pkgName ==" -ForegroundColor Cyan

          New-Item -ItemType Directory -Force $pkgDir | Out-Null
          Copy-Item "dist/ama-gi-player.exe" "$pkgDir/ama-gi-player.exe"

          $binDir = "$pkgDir/bin"
          New-Item -ItemType Directory -Force $binDir | Out-Null
          $binReadmeLines = @(
            "Amagi-Player — папка внешних утилит",
            "",
            "Сюда кладите:",
            "  aria2c.exe   — для скачивания",
            "  ffmpeg.exe   — для транскодинга",
            "  Jackett/     — папка целиком (индексаторы)",
            "  Prowlarr/    — папка целиком (индексаторы)",
            "",
            "Приложение ищет утилиты по пути:",
            "  <папка_с_ama-gi-player.exe>\bin\<утилита>"
          )
          Set-Content -Path "$binDir/README.txt" -Value $binReadmeLines -Encoding UTF8

          $envLines = @(
            "# Amagi-Player — локальный конфиг",
            "# Скопируйте этот файл в .env (рядом с ama-gi-player.exe) и заполните.",
            "",
            "# API-ключ Кинопоиска (необязательно)",
            "KP_API_KEY=",
            "",
            "# Секрет aria2 (необязательно)",
            "ARIA2_SECRET="
          )
          if (Test-Path ".env.example") {
            Copy-Item ".env.example" "$pkgDir/.env.example"
          } else {
            Set-Content -Path "$pkgDir/.env.example" -Value $envLines -Encoding UTF8
          }

          if (Test-Path "INSTALL.md") {
            Copy-Item "INSTALL.md" "$pkgDir/README.txt"
          } elseif (Test-Path "README.md") {
            Copy-Item "README.md" "$pkgDir/README.txt"
          }

          if (Test-Path "LICENSE") {
            Copy-Item "LICENSE" "$pkgDir/LICENSE.txt"
          }

          # Проверки на утечки
          $leaks = @(
            "$pkgDir/.env",
            "$pkgDir/data",
            "$pkgDir/sources.txt",
            "$pkgDir/yts_api_base.txt",
            "$pkgDir/mode.txt",
            "$pkgDir/switch_mode.py"
          )
          foreach ($p in $leaks) {
            if (Test-Path $p) {
              Write-Host "[ERROR] Утечка приватного файла: $p" -ForegroundColor Red
              exit 1
            }
          }

          Write-Host "[OK] Содержимое дистрибутива:" -ForegroundColor Green
          Get-ChildItem -Recurse $pkgDir | Select-Object FullName, @{N="KB";E={[math]::Round($_.Length/1KB,1)}} | Format-Table -AutoSize

      - name: Package ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.version.outputs.version }}"
          $pkgDir = "dist/amagi-player-v$version"
          $zip = "dist/amagi-player-v$version-windows.zip"

          if (-not (Test-Path $pkgDir)) {
            Write-Host "[ERROR] $pkgDir не существует" -ForegroundColor Red
            exit 1
          }

          Compress-Archive -Path "$pkgDir/*" -DestinationPath $zip -CompressionLevel Optimal -Force

          if (-not (Test-Path $zip)) {
            Write-Host "[ERROR] ZIP не создан" -ForegroundColor Red
            exit 1
          }

          $zipFile = Get-Item $zip
          $sizeMB = [math]::Round($zipFile.Length / 1MB, 1)
          Write-Host "[OK] $($zipFile.Name): $sizeMB MB" -ForegroundColor Green

          # Дубликат exe для прямого скачивания
          $exeCopy = "dist/amagi-player-v$version.exe"
          Copy-Item "dist/ama-gi-player.exe" $exeCopy
          $exeSizeMB = [math]::Round((Get-Item $exeCopy).Length / 1MB, 1)
          Write-Host "[OK] $((Get-Item $exeCopy).Name): $exeSizeMB MB" -ForegroundColor Green

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            dist/*.zip
            dist/amagi-player-v*.exe
            dist/nuitka-report.xml
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Amagi-Player ${{ steps.version.outputs.tag }}"
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/amagi-player-v*.exe
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
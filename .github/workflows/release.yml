name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g., v2.2.1-beta.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  # ======================================================================
  # 1. WINDOWS STANDALONE (Dev ZIP)
  # ======================================================================
  build-windows-standalone:
    name: Windows Standalone (Dev ZIP)
    runs-on: windows-latest
    timeout-minutes: 120
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka ordered-set zstandard

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ("${{ github.event.inputs.tag }}" -ne "") { $tag = "${{ github.event.inputs.tag }}" } else { $tag = "$env:GITHUB_REF_NAME" }
          $version = $tag -replace '^v', ''
          $cleanVersion = $version -replace '[-+].*$', ''
          $parts = @($cleanVersion.Split('.'))
          while ($parts.Count -lt 4) { $parts += "0" }
          $version4 = ($parts | Select-Object -First 4) -join '.'
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "version4=$version4" >> $env:GITHUB_OUTPUT

      - name: Build with Nuitka (standalone)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $v4 = "${{ steps.version.outputs.version4 }}"
          python -m nuitka --standalone `
            --enable-plugin=pyqt6 `
            --include-package=PyQt6 `
            --include-qt-plugins=multimedia `
            --include-module=PyQt6.QtWebEngineCore `
            --include-module=PyQt6.QtWebEngineWidgets `
            --include-package=defusedxml `
            --follow-import-to=defusedxml `
            --user-package-configuration-file=nuitka-package-config.yml `
            --include-package=curl_cffi `
            --include-package-data=curl_cffi `
            --include-module=curl_cffi.requests `
            --include-module=curl_cffi._wrapper `
            --include-package=cloudscraper `
            --include-package-data=cloudscraper `
            --follow-import-to=cloudscraper `
            --include-package=libtorrent `
            --include-package=aiohttp `
            --include-package=websockets `
            --include-package=qasync `
            --include-package=psutil `
            --include-package=nodriver `
            --include-data-dir=data=data `
            --include-data-dir=ui=ui `
            --windows-console-mode=force `
            --output-dir=dist `
            --output-filename=amagi-player.exe `
            --assume-yes-for-downloads `
            --company-name=AkashaForge `
            --product-name="Amagi-Player" `
            --file-version=$v4 `
            --product-version=$v4 `
            --file-description="Amagi-Player (standalone)" `
            --report=dist/nuitka-report.xml `
            main.py
          if ($LASTEXITCODE -ne 0) { throw "nuitka failed" }

      - name: Prepare distribution
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $d = (Get-ChildItem "dist" -Directory -Filter "*.dist" | Select-Object -First 1).FullName
          $bin = Join-Path $d "bin"
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          "Optional: Aria2, Jackett, Prowlarr" | Set-Content (Join-Path $bin "README.txt") -Encoding UTF8
          "KP_API_KEY=" | Set-Content (Join-Path $d "config.example.txt") -Encoding UTF8
          "Run amagi-player.exe" | Set-Content (Join-Path $d "README.txt") -Encoding UTF8
          Copy-Item "README.md" (Join-Path $d "README.md") -ErrorAction SilentlyContinue
          Copy-Item "LICENSE"   (Join-Path $d "LICENSE")   -ErrorAction SilentlyContinue
          Copy-Item "NOTICE"    (Join-Path $d "NOTICE")    -ErrorAction SilentlyContinue

      - name: Create ZIP
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $d = (Get-ChildItem "dist" -Directory -Filter "*.dist" | Select-Object -First 1).FullName
          Compress-Archive -Path "$d/*" -DestinationPath "dist/amagi-player-v$version-windows-dev.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-dev
          path: dist/amagi-player-v*-windows-dev.zip
          retention-days: 7

  # ======================================================================
  # 2. WINDOWS ONEFILE — без WebEngine
  # ======================================================================
  build-windows-onefile:
    name: Windows Onefile (no WebEngine)
    runs-on: windows-latest
    timeout-minutes: 120
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka ordered-set zstandard

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ("${{ github.event.inputs.tag }}" -ne "") { $tag = "${{ github.event.inputs.tag }}" } else { $tag = "$env:GITHUB_REF_NAME" }
          $version = $tag -replace '^v', ''
          $cleanVersion = $version -replace '[-+].*$', ''
          $parts = @($cleanVersion.Split('.'))
          while ($parts.Count -lt 4) { $parts += "0" }
          $version4 = ($parts | Select-Object -First 4) -join '.'
          "version=$version" >> $env:GITHUB_OUTPUT
          "version4=$version4" >> $env:GITHUB_OUTPUT

      - name: Build with Nuitka (onefile, no WebEngine)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $v4 = "${{ steps.version.outputs.version4 }}"
          python -m nuitka --onefile `
            --enable-plugin=pyqt6 `
            --include-package=PyQt6 `
            --include-qt-plugins=multimedia `
            --include-package=defusedxml `
            --follow-import-to=defusedxml `
            --user-package-configuration-file=nuitka-package-config.yml `
            --include-package=curl_cffi `
            --include-package-data=curl_cffi `
            --include-module=curl_cffi.requests `
            --include-module=curl_cffi._wrapper `
            --include-package=cloudscraper `
            --include-package-data=cloudscraper `
            --follow-import-to=cloudscraper `
            --include-package=libtorrent `
            --include-package=aiohttp `
            --include-package=websockets `
            --include-package=qasync `
            --include-package=psutil `
            --include-package=nodriver `
            --include-data-dir=data=data `
            --include-data-dir=ui=ui `
            --windows-console-mode=force `
            --output-dir=dist-onefile `
            --output-filename=amagi-player.exe `
            --assume-yes-for-downloads `
            --company-name=AkashaForge `
            --product-name="Amagi-Player" `
            --file-version=$v4 `
            --product-version=$v4 `
            --file-description="Amagi-Player (onefile)" `
            main.py
          if ($LASTEXITCODE -ne 0) { throw "nuitka onefile failed" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-onefile
          path: dist-onefile/amagi-player.exe
          retention-days: 7

  # ======================================================================
  # 3. LINUX STANDALONE — без --file-version (Windows-only, Nuitka игнорирует)
  # ======================================================================
  build-linux:
    name: Linux Standalone (experimental)
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libglib2.0-0 libgl1 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xfixes0 libxcb-render-util0 libxcb-randr0 \
            libxcomposite1 libxdamage1 libxrandr2 libxtst6 \
            libxcursor1 libxi6 libxss1 libgbm1 \
            libnss3 libasound2 ffmpeg ccache

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka ordered-set zstandard

      - name: Build with Nuitka (Linux)
        run: |
          set -e
          python -m nuitka \
            --standalone \
            --enable-plugin=pyqt6 \
            --include-package=PyQt6 \
            --include-qt-plugins=multimedia \
            --include-module=PyQt6.QtWebEngineCore \
            --include-module=PyQt6.QtWebEngineWidgets \
            --include-package=defusedxml \
            --follow-import-to=defusedxml \
            --user-package-configuration-file=nuitka-package-config.yml \
            --include-package=curl_cffi \
            --include-package-data=curl_cffi \
            --include-module=curl_cffi.requests \
            --include-module=curl_cffi._wrapper \
            --include-package=cloudscraper \
            --include-package-data=cloudscraper \
            --follow-import-to=cloudscraper \
            --include-package=libtorrent \
            --include-package=aiohttp \
            --include-package=websockets \
            --include-package=qasync \
            --include-package=psutil \
            --include-package=nodriver \
            --include-data-dir=data=data \
            --include-data-dir=ui=ui \
            --output-dir=dist-linux \
            --output-filename=amagi-player \
            --assume-yes-for-downloads \
            --report=dist-linux/nuitka-report.xml \
            main.py

      - name: Create tarball
        run: |
          set -e
          DIST=$(find dist-linux -maxdepth 1 -type d -name "*.dist" | head -1)
          test -n "$DIST" || { echo "no .dist"; exit 1; }
          cat > "$DIST/README-LINUX.txt" <<'EOF'
          Amagi-Player — Linux (experimental)
          Requires: sudo apt install libxcb-cursor0 libegl1 ffmpeg libnss3 libasound2
          Run: ./amagi-player
          EOF
          VERSION="${{ steps.version.outputs.version }}"
          tar -C "$DIST" -czf "dist-linux/amagi-player-${VERSION}-linux-x86_64.tar.gz" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-standalone
          path: dist-linux/*.tar.gz
          retention-days: 7

  # ======================================================================
  # 4. RELEASE — срабатывает если ХОТЯ БЫ ОДНА сборка успешна
  # ======================================================================
  create-release:
    name: Publish Release
    needs: [build-windows-standalone, build-windows-onefile, build-linux]
    runs-on: ubuntu-latest
    if: |
      always() && (
        needs.build-windows-standalone.result == 'success' ||
        needs.build-windows-onefile.result == 'success' ||
        needs.build-linux.result == 'success'
      )

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
        continue-on-error: true

      - name: List downloaded artifacts
        run: find artifacts -type f 2>/dev/null | sort || echo "no artifacts"

      - name: Determine version
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Amagi-Player ${{ steps.version.outputs.tag }}"
          generate_release_notes: true
          files: |
            artifacts/**/*.zip
            artifacts/**/*.exe
            artifacts/**/*.tar.gz
          draft: false
          prerelease: true
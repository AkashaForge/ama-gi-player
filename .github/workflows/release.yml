name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g., v1.2.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Build standalone and release
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka ordered-set zstandard

          Write-Host "== Verify imports ==" -ForegroundColor Cyan
          python -c "import PyQt6; print('PyQt6 OK')"
          python -c "import libtorrent; print('libtorrent OK')"
          python -c "import aiohttp; print('aiohttp OK')"
          python -c "import qasync; print('qasync OK')"
          python -c "import psutil; print('psutil OK')"
          python -c "import websockets; print('websockets OK')"
          python -c "import nodriver; print('nodriver OK')"
          Write-Host "All dependencies installed" -ForegroundColor Green

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ("${{ github.event.inputs.tag }}" -ne "") {
            $tag = "${{ github.event.inputs.tag }}"
          } else {
            $tag = "$env:GITHUB_REF_NAME"
          }
          if ([string]::IsNullOrWhiteSpace($tag)) {
            Write-Host "[ERROR] Cannot determine tag" -ForegroundColor Red
            exit 1
          }
          $version = $tag -replace '^v', ''
          $parts = @($version.Split('.'))
          while ($parts.Count -lt 4) { $parts += "0" }
          $version4 = ($parts | Select-Object -First 4) -join '.'
          "tag=$tag"           >> $env:GITHUB_OUTPUT
          "version=$version"   >> $env:GITHUB_OUTPUT
          "version4=$version4" >> $env:GITHUB_OUTPUT
          Write-Host "Tag=$tag Version=$version Version4=$version4"

      - name: Build with Nuitka (standalone)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $v4 = "${{ steps.version.outputs.version4 }}"

          $nuitkaArgs = @(
            "--standalone"
            "--enable-plugin=pyqt6"
            "--include-package=PyQt6"
            "--include-module=PyQt6.QtWebEngineCore"
            "--include-module=PyQt6.QtWebEngineWidgets"
            "--include-package=libtorrent"
            "--include-package=aiohttp"
            "--include-package=websockets"
            "--include-package=qasync"
            "--include-package=psutil"
            "--include-package=nodriver"
            "--include-data-dir=data=data"
            "--include-data-dir=ui=ui"
            "--windows-console-mode=force"
            "--output-dir=dist"
            "--output-filename=amagi-player.exe"
            "--assume-yes-for-downloads"
            "--company-name=AkashaForge"
            "--product-name=Amagi-Player"
            "--file-version=$v4"
            "--product-version=$v4"
            "--file-description=Amagi-Player"
            "--report=dist/nuitka-report.xml"
            "main.py"
          )

          Write-Host ""
          Write-Host "python -m nuitka $($nuitkaArgs -join ' ')" -ForegroundColor Gray
          Write-Host ""

          python -m nuitka @nuitkaArgs
          if ($LASTEXITCODE -ne 0) {
            Write-Host "[ERROR] Nuitka exit=$LASTEXITCODE" -ForegroundColor Red
            exit $LASTEXITCODE
          }

      - name: Verify standalone build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "dist\main.dist\amagi-player.exe"
          if (-not (Test-Path $exe)) {
            Write-Host "[ERROR] exe not built" -ForegroundColor Red
            Get-ChildItem -Recurse dist | Out-Host
            exit 1
          }
          $mb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "[OK] exe: $mb MB" -ForegroundColor Green

      - name: Prepare distribution
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dist = "dist\main.dist"
          $data = Join-Path $dist "data"
          $bin  = Join-Path $dist "bin"

          # ---- bin/ ----
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          $binLines = @(
            "Amagi-Player - external utilities folder",
            "=========================================",
            "",
            "Optional: place here",
            "  Aria2\aria2c.exe",
            "  Jackett\  (whole folder)",
            "  Prowlarr\ (whole folder)",
            "",
            "Not used in PUBLIC mode."
          )
          Set-Content -Path (Join-Path $bin "README.txt") -Value $binLines -Encoding UTF8

          # ---- Clean personal files from data\ ----
          $personal = @(
            "sources.txt","sources.txt.bak",
            "direct_sources.txt","direct_sources.txt.bak",
            "indexers.txt","mode.txt",
            "whitelist.db","whitelist.db-wal","whitelist.db-shm","whitelist.db.private.bak",
            "app_data.db","app_data.db-wal","app_data.db-shm",
            "yts_api_base.txt","yts_api_base.txt.private.bak"
          )
          foreach ($f in $personal) {
            $p = Join-Path $data $f
            if (Test-Path $p) { Remove-Item $p -Force }
          }

          # ---- config.example.txt ----
          $cfgLines = @(
            "# Amagi-Player - local config",
            "# Copy to config.txt (or create .env next to exe)",
            "KP_API_KEY=",
            "ARIA2_SECRET="
          )
          Set-Content -Path (Join-Path $dist "config.example.txt") -Value $cfgLines -Encoding UTF8

          # ---- README.txt for end user ----
          $readmeLines = @(
            "Amagi-Player - how to run",
            "==========================",
            "",
            "1. Run amagi-player.exe",
            "2. Accept the terms on first launch",
            "3. data\ and bin\ folders will be created automatically",
            "4. Configure sources via data\sources.txt (template: data\sources.example.txt)",
            "5. API keys go to .env next to exe (template: .env.example)",
            "",
            "Mode: data\mode.txt -> public | private"
          )
          Set-Content -Path (Join-Path $dist "README.txt") -Value $readmeLines -Encoding UTF8

          # ---- Docs (optional) ----
          if (Test-Path "README.md") { Copy-Item "README.md" (Join-Path $dist "README.md") }
          if (Test-Path "LICENSE")   { Copy-Item "LICENSE"   (Join-Path $dist "LICENSE") }
          if (Test-Path "NOTICE")    { Copy-Item "NOTICE"    (Join-Path $dist "NOTICE") }

          Write-Host "=== Final structure ===" -ForegroundColor Cyan
          Get-ChildItem $dist | Select-Object Name | Format-Table

      - name: Create ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.version.outputs.version }}"
          $zip = "dist/amagi-player-v$version-windows.zip"
          Compress-Archive -Path "dist/main.dist/*" -DestinationPath $zip -Force
          if (-not (Test-Path $zip)) { exit 1 }
          $mb = [math]::Round((Get-Item $zip).Length / 1MB, 1)
          Write-Host "[OK] $zip ($mb MB)" -ForegroundColor Green

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            dist/*.zip
            dist/nuitka-report.xml
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Amagi-Player ${{ steps.version.outputs.tag }}"
          generate_release_notes: true
          files: dist/amagi-player-v${{ steps.version.outputs.version }}-windows.zip
          draft: false
          prerelease: false